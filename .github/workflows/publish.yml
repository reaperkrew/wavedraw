name: Publish

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Length checks
        run: npm run check:lengths

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Audit dependencies
        run: npm audit

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Check if version already published
        id: published
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "wavedraw@$VERSION" version --silent > /dev/null 2>&1; then
            echo "already published: wavedraw@$VERSION — skipping publish"
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish package
        if: steps.published.outputs.published == 'false'
        run: npm publish --access public

      - name: Tag release
        if: steps.published.outputs.published == 'false'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          git fetch --tags
          if git rev-parse -q --verify "refs/tags/$TAG" > /dev/null; then
            echo "tag already exists: $TAG — skipping tag creation"
            exit 0
          fi
          git config user.name reaperkrew
          git config user.email reaperkrew@users.noreply.github.com
          git tag -a "$TAG" -m "wavedraw@$VERSION"
          git push origin "$TAG"
